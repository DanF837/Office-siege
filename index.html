<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Office Siege</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="mainMenu" class="screen">
      <h1 class="title">Office Siege</h1>
      <p class="tagline">
        The employees are angry. The staplers have snapped. Defend your desk!
      </p>

      <div class="menu-buttons">
        <button class="button-link" onclick="playAndNavigate('hub.html')">
          Start Game
        </button>
        <button class="button-link" onclick="playAndNavigate('credits.html')">
          Credits
        </button>
      </div>
    </div>

    <!-- Version Badge -->
    <div
      style="
        position: fixed;
        bottom: 10px;
        right: 10px;
        font-size: 28px;
        color: #fff;
        font-family: sans-serif;
        background: rgba(0, 0, 0, 0.8);
        padding: 4px 10px;
        border-radius: 6px;
        pointer-events: none;
        z-index: 9999;
      ">
      v1.0
    </div>

    <canvas id="gameCanvas" style="display: none"></canvas>

    <!-- JavaScript files -->
    <script type="module" src="ui.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>

    <script type="module" src="./js/globalAudio.js"></script>

    <script>
      const clickSound = new Audio("assets/audio/button-click.mp3");

      function playAndNavigate(url) {
        const sound = clickSound.cloneNode();
        sound.play().catch(console.warn);
        setTimeout(() => {
          window.location.href = url;
        }, 200);
      }
    </script>
  </body>
</html>
