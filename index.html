<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Office Siege</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="data:," />
    <style>
      body {
        background:
          radial-gradient(circle, rgba(0, 0, 0, 0.06) 1px, transparent 1px),
          linear-gradient(145deg, #d4c5a9, #c19a6b);
        background-size: 14px 14px, 100% 100%;
      }

      .screen {
        max-width: 100%;
        width: 100vw;
        height: 100vh;
        padding: 0;
      }

      .main-menu-card {
        background: var(--paper-white);
        border: 2px solid var(--paper-edge);
        border-radius: 8px;
        padding: 48px 56px;
        box-shadow: 2px 4px 16px rgba(0, 0, 0, 0.15);
        text-align: center;
        width: 90%;
        max-width: 600px;
      }

      .main-menu-card .title {
        color: var(--desk-brown);
        font-size: 2.8rem;
        margin-bottom: 6px;
      }

      .main-menu-card .tagline {
        color: var(--desk-brown);
        font-size: 1.1rem;
        margin-bottom: 32px;
        opacity: 0.8;
      }

      .main-menu-card .menu-buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
      }

      .main-menu-card .menu-btn {
        display: block;
        width: 280px;
        padding: 14px 0;
        font-size: 17px;
        font-weight: 700;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        box-shadow: 1px 2px 4px rgba(0, 0, 0, 0.12);
      }

      .menu-btn--start {
        background: var(--sticky-green);
        color: var(--desk-brown);
      }

      .menu-btn--credits {
        background: var(--sticky-yellow);
        color: var(--desk-brown);
      }

      .menu-btn--patch {
        background: var(--sticky-blue);
        color: var(--desk-brown);
      }

      .menu-btn--exit {
        background: var(--sticky-pink);
        color: var(--desk-brown);
      }

      .main-menu-card .menu-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.18);
      }

      .menu-divider {
        border: none;
        border-top: 2px dashed var(--paper-edge);
        margin: 24px 0;
      }
    </style>
  </head>
  <body>
    <div id="mainMenu" class="screen">
      <div class="main-menu-card">
        <h1 class="title">Office Siege</h1>
        <p class="tagline">
          The employees are angry. The staplers have snapped. Defend your desk!
        </p>

        <hr class="menu-divider" />

        <div class="menu-buttons">
          <button class="menu-btn menu-btn--start" onclick="playAndNavigate('hub.html')">
            Start Game
          </button>
          <button class="menu-btn menu-btn--credits" onclick="playAndNavigate('credits.html')">
            Credits
          </button>
          <button class="menu-btn menu-btn--patch" onclick="playAndNavigate('patch-notes.html')">
            Patch Notes
          </button>
          <button class="menu-btn menu-btn--exit" onclick="window.electronAPI?.exitApp()">
            Exit Game
          </button>
        </div>
      </div>
    </div>

    <!-- Version Badge -->
    <div class="version-badge">v2.0</div>

    <script type="module" src="./js/globalAudio.js"></script>
    <script type="module" src="./js/navigation.js"></script>
  </body>
</html>
