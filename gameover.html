<div id="game-over-screen" style="
  position: fixed;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, 0.85);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  color: white;
  font-size: 32px;
  font-family: sans-serif;
  display: none;
">
  <h1 style="margin-bottom: 20px;">Game Over</h1>
  <div style="display: flex; gap: 20px;">
    <button onclick="window.retryGame()" style="padding: 10px 20px;">Retry</button>
    <button onclick="window.goHome()" style="padding: 10px 20px;">Home</button>
  </div>
</div>
