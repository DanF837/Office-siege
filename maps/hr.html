<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR Hallway</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      canvas {
        background: #000;
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas"></canvas>

    <div id="game-over-screen" class="overlay overlay-dark game-over-text">
      <h1 class="popup-title">Game Over</h1>
      <div class="popup-btn-row">
        <button onclick="retryGame()" class="popup-btn">Retry</button>
        <button onclick="goHome()" class="popup-btn">Home</button>
      </div>
    </div>

    <div id="pause-popup" class="overlay overlay-dark pause-text">
      <p>Paused</p>
      <div class="pause-buttons">
        <button onclick="togglePause()" class="pause-btn">Return to Game</button>
      </div>
    </div>

    <div id="upgrade-menu" class="upgrade-panel">
      <p>Upgrade Tower</p>
      <button onclick="upgradeStat('range')">+Range</button>
      <button onclick="upgradeStat('damage')">+Damage</button>
      <button onclick="upgradeStat('fireRate')">+Fire Rate</button>
    </div>

    <div id="victory-screen" class="overlay overlay-darker victory-text">
      <h1 class="popup-title">HR Boss Defeated!</h1>
      <p>You've survived the bureaucracy.</p>
      <div class="victory-buttons">
        <button onclick="continueGame()" class="popup-btn-lg">Continue Playing</button>
        <button onclick="goHome()" class="popup-btn-lg">Return to Menu</button>
      </div>
    </div>

    <!-- Sell Confirmation Popup -->
    <div id="sell-confirm-popup" class="overlay overlay-top">
      <p id="sell-message" class="sell-message"></p>
      <div class="popup-btn-row">
        <button id="confirm-sell-btn" class="popup-btn-danger">Yes, Sell</button>
        <button onclick="closeSellPopup()" class="popup-btn">Cancel</button>
      </div>
    </div>

    <div id="message-popup" class="overlay overlay-top">
      <p id="message-text" class="message-text"></p>
      <button onclick="closeMessagePopup()" class="popup-btn">OK</button>
    </div>

    <script>
      let victoryShown = false;

      function showGameOver() {
        document.getElementById("game-over-screen").style.display = "flex";
      }

      function retryGame() {
        location.reload();
      }

      function goHome() {
        window.location.href = "../hub.html";
      }

      function showVictoryScreen() {
        if (victoryShown) return;
        victoryShown = true;
        document.getElementById("victory-screen").style.display = "flex";
        isPaused = true;
      }

      function continueGame() {
        document.getElementById("victory-screen").style.display = "none";
        isPaused = false;
        waveInProgress = false;
        allEnemiesSpawned = false;
        const btn = document.getElementById("start-btn");
        if (btn) {
          btn.disabled = false;
          btn.onclick = () => startWave();
        }
      }

      window.showVictoryScreen = showVictoryScreen;
      window.continueGame = continueGame;
      window.showGameOver = showGameOver;
      window.retryGame = retryGame;
      window.goHome = goHome;
      window.showMessagePopup = function (text) {
        document.getElementById("message-text").innerText = text;
        document.getElementById("message-popup").style.display = "flex";
      };
      window.closeMessagePopup = function () {
        document.getElementById("message-popup").style.display = "none";
      };
    </script>

    <script type="module">
      import { playSound } from "../js/gameAudio.js";
      import * as ui from "../ui.js";
      import {
        VIRTUAL_WIDTH, VIRTUAL_HEIGHT, SPRITE_SIZE, TOWER_COLLISION_RADIUS,
        PATH_BUFFER, TOWER_MIN_DISTANCE, PROJECTILE_SPEED, SPAWN_INTERVAL,
        MAX_UPGRADE_LEVEL, UPGRADE_BASE_COST, towerStats, defaultTower,
        towerPrices, enemyTypes, PLACEMENT_COLOR, COLOR_TOLERANCE,
        difficultySettings,
      } from "../js/config.js";

      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      const offscreenCanvas = document.createElement("canvas");
      offscreenCanvas.width = VIRTUAL_WIDTH;
      offscreenCanvas.height = VIRTUAL_HEIGHT;
      const offscreenCtx = offscreenCanvas.getContext("2d");

      const enemies = [];

      const enemySprites = {
        normal: new Image(),
        fast: new Image(),
        tank: new Image(),
        boss: new Image(),
      };

      enemySprites.normal.src = "../assets/enemy/enemy_normal.png";
      enemySprites.fast.src = "../assets/enemy/enemy_fast.png";
      enemySprites.tank.src = "../assets/enemy/enemy_tank.png";
      enemySprites.boss.src = "../assets/enemy/enemy_boss.png";

      let currentWave = 0;
      let gameSpeed = 1;

      let waveInProgress = false;
      let allEnemiesSpawned = false;
      let selectedTower = null;
      let isPaused = false;

      window.toggleSpeed = function () {
        gameSpeed = gameSpeed === 1 ? 2 : 1;
        const btn = document.getElementById("speed-btn");
        if (btn) {
          btn.textContent = gameSpeed + "x";
          btn.classList.toggle("speed-active", gameSpeed === 2);
        }
      };

      function togglePause() {
        isPaused = !isPaused;
        const popup = document.getElementById("pause-popup");
        if (popup) popup.style.display = isPaused ? "flex" : "none";
      }

      function resumeGame() {
        isPaused = false;
        const popup = document.getElementById("pause-popup");
        if (popup) popup.style.display = "none";
      }

      const projectiles = [];

      function updateEnemies(deltaTime) {
        if (isPaused) return;
        for (let i = enemies.length - 1; i >= 0; i--) {
          const enemy = enemies[i];
          const target = path[enemy.waypointIndex];
          if (!target) continue;

          const dx = target.x - enemy.x;
          const dy = target.y - enemy.y;
          const dist = Math.hypot(dx, dy);
          const moveDist = enemy.speed * deltaTime;

          if (dist < moveDist) {
            enemy.x = target.x;
            enemy.y = target.y;
            enemy.waypointIndex++;
          } else {
            enemy.x += (dx / dist) * moveDist;
            enemy.y += (dy / dist) * moveDist;
          }

          if (enemy.hp <= 0) {
            enemies.splice(i, 1);
            ui.addMoney(enemy.reward);
            continue;
          }

          if (enemy.waypointIndex >= path.length) {
            enemies.splice(i, 1);
            ui.loseLife();
            if (ui.lives <= 0) showGameOver();
          }
        }

        if (waveInProgress && allEnemiesSpawned && enemies.length === 0) {
          if (currentWave === 25 && !victoryShown) {
            showVictoryScreen();
            return;
          }

          waveInProgress = false;
          allEnemiesSpawned = false;

          ui.addMoney(50 + currentWave * 10);
          showWavePreview(currentWave + 1);

          const btn = document.getElementById("start-btn");
          if (btn) btn.disabled = false;
        }
      }

      function showUpgradeMenu() {
        const menu = document.getElementById("upgrade-menu");

        if (selectedTower) {
          const levels = {
            range: selectedTower.rangeLevel,
            damage: selectedTower.damageLevel,
            fireRate: selectedTower.fireRateLevel,
          };

          const costs = {
            range:
              levels.range >= MAX_UPGRADE_LEVEL
                ? null
                : Math.round(
                    (UPGRADE_BASE_COST * Math.pow(1.5, levels.range - 1)) / 10
                  ) * 10,
            damage:
              levels.damage >= MAX_UPGRADE_LEVEL
                ? null
                : Math.round(
                    (UPGRADE_BASE_COST * Math.pow(1.5, levels.damage - 1)) / 10
                  ) * 10,
            fireRate:
              levels.fireRate >= MAX_UPGRADE_LEVEL
                ? null
                : Math.round(
                    (UPGRADE_BASE_COST * Math.pow(1.5, levels.fireRate - 1)) / 10
                  ) * 10,
          };

          const buttonHTML = (stat, label, desc) => {
            const level = levels[stat];
            const cost = costs[stat];

            if (level >= MAX_UPGRADE_LEVEL) {
              return `<button class="upgrade-btn" disabled title="Already at max level">${label} (MAX)</button>`;
            }

            const cantAfford = cost > ui.money;
            const disabled = cantAfford ? "disabled" : "";
            const title = cantAfford ? `${desc} — Need more money` : desc;
            return `<button class="upgrade-btn" onclick="upgradeStat('${stat}')" ${disabled} title="${title}">${label} ($${cost})</button>`;
          };

          const basePrice = towerPrices[selectedTower.type];
          const totalLevels = selectedTower.rangeLevel - 1 + (selectedTower.damageLevel - 1) + (selectedTower.fireRateLevel - 1);
          const totalSpent = basePrice + totalLevels * UPGRADE_BASE_COST;
          const sellRefund = Math.floor(totalSpent / 2);

          menu.innerHTML = `
            <p class="upgrade-title">Upgrade Tower</p>
            ${buttonHTML("range", "+Range", "Increases tower range by +10 units")}
            ${buttonHTML("damage", "+Damage", "Increases tower damage by +10")}
            ${buttonHTML("fireRate", "+Fire Rate", "Improves fire rate (faster shooting)")}
            <p class="upgrade-targeting">Targeting: <strong>${selectedTower.targetMode.toUpperCase()}</strong></p>
            <button class="upgrade-btn--mode" onclick="cycleTargetMode()">Change Mode</button>
            <button class="upgrade-btn--sell" onclick="sellSelectedTower()">Sell Tower ($${sellRefund})</button>
          `;
          menu.style.display = "block";
        }
      }

      window.refreshUpgradeMenu = function () {
        if (document.getElementById("upgrade-menu").style.display === "block") {
          showUpgradeMenu();
        }
      };

      function hideUpgradeMenu() {
        const menu = document.getElementById("upgrade-menu");
        menu.style.display = "none";
      }

      window.upgradeStat = function (stat) {
        if (!selectedTower) return;

        const currentLevel = selectedTower[stat + "Level"];

        if (currentLevel >= MAX_UPGRADE_LEVEL) {
          showMessagePopup("Max upgrade level reached.");
          return;
        }

        const cost =
          Math.round((UPGRADE_BASE_COST * Math.pow(1.5, currentLevel - 1)) / 10) * 10;

        if (ui.money >= cost) {
          ui.addMoney(-cost);
          selectedTower[stat + "Level"]++;
          playSound("upgrade");
          showUpgradeMenu();
        }
      };

      window.sellSelectedTower = function () {
        if (!selectedTower) return;

        const basePrice = towerPrices[selectedTower.type];

        const totalLevels =
          selectedTower.rangeLevel -
          1 +
          (selectedTower.damageLevel - 1) +
          (selectedTower.fireRateLevel - 1);

        const totalSpent = basePrice + totalLevels * UPGRADE_BASE_COST;
        const refund = Math.floor(totalSpent / 2);

        window._pendingSellRefund = refund;
        document.getElementById(
          "sell-message"
        ).innerText = `Sell this tower for $${refund}?`;

        document.getElementById("sell-confirm-popup").style.display = "flex";
      };

      function updateProjectiles(deltaTime) {
        if (isPaused) return;
        for (let i = projectiles.length - 1; i >= 0; i--) {
          const p = projectiles[i];

          if (!enemies.includes(p.target) || p.target.hp <= 0) {
            projectiles.splice(i, 1);
            continue;
          }

          const dx = p.target.x - p.x;
          const dy = p.target.y - p.y;
          const dist = Math.hypot(dx, dy);
          const moveDist = p.speed * deltaTime;

          if (dist < moveDist) {
            p.target.hp -= p.damage;
            projectiles.splice(i, 1);
            playSound("hit");
            continue;
          }

          p.x += (dx / dist) * moveDist;
          p.y += (dy / dist) * moveDist;
        }
      }

      function drawEnemies() {
        enemies.forEach((e) => {
          const sprite = enemySprites[e.type] || enemySprites.normal;
          if (sprite.complete) {
            ctx.drawImage(sprite, e.x - SPRITE_SIZE / 2, e.y - SPRITE_SIZE / 2, SPRITE_SIZE, SPRITE_SIZE);
          }

          const barWidth = 40;
          const barHeight = 6;
          const maxHp = e.maxHp || 100;
          const hpRatio = e.hp / maxHp;

          ctx.fillStyle = "red";
          ctx.fillRect(e.x - barWidth / 2, e.y - 30, barWidth, barHeight);

          ctx.fillStyle = "lime";
          ctx.fillRect(
            e.x - barWidth / 2,
            e.y - 30,
            barWidth * hpRatio,
            barHeight
          );

          ctx.strokeStyle = "black";
          ctx.strokeRect(e.x - barWidth / 2, e.y - 30, barWidth, barHeight);
        });
      }

      function drawProjectiles() {
        ctx.fillStyle = "orange";
        projectiles.forEach((p) => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      // Wave composition and preview (outer scope so updateEnemies can access)
      function getWaveComposition(waveNum) {
        const count = Math.floor(10 + waveNum * 1.25);
        if (waveNum <= 8) {
          const fastCount = Math.floor(count * 0.2);
          return { normal: count - fastCount, fast: fastCount, tank: 0 };
        } else if (waveNum <= 16) {
          const tankRatio = 0.1 + (waveNum - 9) * 0.03;
          const fastRatio = 0.25;
          const tankCount = Math.floor(count * tankRatio);
          const fastCount = Math.floor(count * fastRatio);
          return { normal: count - fastCount - tankCount, fast: fastCount, tank: tankCount };
        } else {
          const tankCount = Math.floor(count * 0.4);
          const fastCount = Math.floor(count * 0.35);
          return { normal: count - fastCount - tankCount, fast: fastCount, tank: tankCount };
        }
      }

      function generateWave(waveNum) {
        const diff = difficultySettings[localStorage.getItem("difficulty") || "normal"] || difficultySettings.normal;

        if (waveNum === 25) {
          return {
            enemies: [
              {
                type: "boss",
                hp: Math.floor(enemyTypes.boss.hp * diff.hpMult),
                speed: Math.floor(enemyTypes.boss.speed * diff.speedMult),
                reward: enemyTypes.boss.reward,
                count: 1,
              },
            ],
          };
        }

        const comp = getWaveComposition(waveNum);
        const waveEnemies = [];

        const addEnemies = (type, num) => {
          const base = enemyTypes[type];
          const scaleFactor = type === "tank" ? 1.08 : type === "fast" ? 1.04 : 1.05;
          const hp = Math.floor(base.hp * Math.pow(scaleFactor, waveNum) * diff.hpMult);
          const speed = Math.floor(base.speed * diff.speedMult);
          const reward = type === "tank" ? 2 : base.reward;
          for (let i = 0; i < num; i++) {
            waveEnemies.push({ type, hp, speed, reward, count: 1 });
          }
        };

        addEnemies("normal", comp.normal);
        addEnemies("fast", comp.fast);
        addEnemies("tank", comp.tank);

        // Mini-boss every 10 waves after 25 (wave 35, 45, 55, ...)
        if (waveNum > 25 && waveNum % 10 === 5) {
          const bossHp = Math.floor(enemyTypes.boss.hp * 0.5 * Math.pow(1.08, waveNum) * diff.hpMult);
          waveEnemies.push({
            type: "boss",
            hp: bossHp,
            speed: Math.floor(enemyTypes.boss.speed * diff.speedMult),
            reward: 500,
            count: 1,
          });
        }

        // Shuffle for variety
        for (let i = waveEnemies.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [waveEnemies[i], waveEnemies[j]] = [waveEnemies[j], waveEnemies[i]];
        }

        return { enemies: waveEnemies };
      }

      function describeWave(waveNum) {
        if (waveNum === 25) return "Wave 25: BOSS — The HR Manager";
        const comp = getWaveComposition(waveNum);
        const total = comp.normal + comp.fast + comp.tank;
        const parts = [];
        if (comp.normal > 0) parts.push("Normal");
        if (comp.fast > 0) parts.push("Fast");
        if (comp.tank > 0) parts.push("Tank");
        const hasMini = waveNum > 25 && waveNum % 10 === 5;
        if (hasMini) parts.push("MINI-BOSS");
        return `Wave ${waveNum}: ${total + (hasMini ? 1 : 0)} enemies — ${parts.join(", ")}`;
      }

      function showWavePreview(nextWave) {
        const el = document.getElementById("wave-preview");
        const text = document.getElementById("wave-preview-text");
        if (!el || !text) return;
        text.textContent = describeWave(nextWave);
        el.style.display = "block";
      }

      function hideWavePreview() {
        const el = document.getElementById("wave-preview");
        if (el) el.style.display = "none";
      }

      // Load UI HTML
      fetch("../ui.html")
        .then((res) => res.text())
        .then((html) => {
          document.body.insertAdjacentHTML("beforeend", html);

          // Initialize UI now that ui.html elements exist in the DOM
          ui.initUI();

          if (typeof ui.updateUI === "function") {
            ui.updateUI();

            // Show preview for wave 1 on load
            showWavePreview(1);

            window.startWave = () => {
              if (waveInProgress) return;

              isPaused = false;
              hideWavePreview();
              currentWave++;

              const waveData = generateWave(currentWave);
              let enemyQueue = [];

              waveData.enemies.forEach((entry) => {
                for (let i = 0; i < entry.count; i++) {
                  enemyQueue.push({ ...entry });
                }
              });

              waveInProgress = true;
              allEnemiesSpawned = false;
              document.getElementById("start-btn").disabled = true;

              ui.startWave();

              let spawned = 0;
              let spawnTimer = null;

              function scheduleNextSpawn() {
                spawnTimer = setTimeout(() => {
                  if (isPaused) {
                    // Retry shortly when paused
                    scheduleNextSpawn();
                    return;
                  }

                  const enemy = enemyQueue[spawned];
                  enemies.push({
                    x: path[0].x,
                    y: path[0].y,
                    waypointIndex: 1,
                    speed: enemy.speed,
                    hp: enemy.hp,
                    maxHp: enemy.hp,
                    type: enemy.type,
                    reward: enemy.reward,
                  });

                  spawned++;
                  if (spawned >= enemyQueue.length) {
                    allEnemiesSpawned = true;
                  } else {
                    scheduleNextSpawn();
                  }
                }, SPAWN_INTERVAL / gameSpeed);
              }

              scheduleNextSpawn();
            };

            document.querySelectorAll("[data-tower]").forEach((img) => {
              img.addEventListener("dragstart", (e) => {
                draggingTower = e.target.dataset.tower;
                ghostImage.src = e.target.src;
                isDragging = true;
              });
            });
          }
        });

      canvas.addEventListener("click", (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = VIRTUAL_WIDTH / rect.width;
        const scaleY = VIRTUAL_HEIGHT / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;

        if (isDragging && canPlaceTower(x, y)) {
          const price = towerPrices[draggingTower];
          if (ui.money >= price) {
            ui.addMoney(-price);
            towers.push({
              x,
              y,
              type: draggingTower,
              level: 1,
              rangeLevel: 1,
              damageLevel: 1,
              fireRateLevel: 1,
              cooldown: 0,
              targetMode: "first",
            });

            playSound("place");
          } else {
            showMessagePopup("Not enough money to place this tower.");
          }
          isDragging = false;
          draggingTower = null;

          return;
        }

        selectedTower =
          towers.find((t) => Math.hypot(t.x - x, t.y - y) < TOWER_COLLISION_RADIUS) || null;

        if (selectedTower) {
          showUpgradeMenu();
        } else {
          hideUpgradeMenu();
        }
      });

      const background = new Image();
      background.src = "../assets/maps/hr_background.png";

      const path = [
        { x: 1657, y: 785 },
        { x: 1657, y: 958 },
        { x: 427, y: 958 },
        { x: 427, y: 608 },
        { x: 836, y: 608 },
        { x: 836, y: 862 },
        { x: 1090, y: 862 },
        { x: 1090, y: 635 },
        { x: 1410, y: 634 },
        { x: 1410, y: 459 },
        { x: 1641, y: 459 },
        { x: 1641, y: 330 },
        { x: 150, y: 326 },
        { x: 150, y: 610 },
        { x: 426, y: 610 },
        { x: 426, y: 955 },
        { x: 1655, y: 956 },
        { x: 1655, y: 786 },
      ];

      const obstacles = [
        { x: 840, y: 10, width: 70, height: 80 },
        { x: 50, y: 20, width: 80, height: 50 },
        { x: 620, y: 720, width: 60, height: 70 },
        { x: 1250, y: 500, width: 70, height: 60 },
        { x: 300, y: 440, width: 65, height: 70 },
        { x: 950, y: 180, width: 75, height: 55 },
        { x: 1500, y: 700, width: 60, height: 65 },
      ];

      const towers = [];

      let draggingTower = null;
      let ghostImage = new Image();
      let isDragging = false;
      let mouseX = 0,
        mouseY = 0;

      const towerImages = {
        cannon: new Image(),
        shredder: new Image(),
        sniper: new Image(),
      };

      towerImages.cannon.src = "../assets/tower/coffee_cannon.png";
      towerImages.shredder.src = "../assets/tower/paper_shredder.png";
      towerImages.sniper.src = "../assets/tower/monitor_sniper.png";

      let lastTime = performance.now();

      function resizeCanvas() {
        canvas.width = VIRTUAL_WIDTH;
        canvas.height = VIRTUAL_HEIGHT;
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        gameLoop();
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      canvas.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = VIRTUAL_WIDTH / rect.width;
        const scaleY = VIRTUAL_HEIGHT / rect.height;
        mouseX = (e.clientX - rect.left) * scaleX;
        mouseY = (e.clientY - rect.top) * scaleY;
      });

      function drawObstacles() {
        // Obstacles are invisible but still block sniper line-of-sight
      }

      function drawTowers() {
        towers.forEach((t) => {
          const img = towerImages[t.type];
          if (img && img.complete) {
            ctx.drawImage(towerImages[t.type], t.x - TOWER_COLLISION_RADIUS, t.y - TOWER_COLLISION_RADIUS, SPRITE_SIZE, SPRITE_SIZE);
          }

          if (t === selectedTower) {
            ctx.beginPath();
            ctx.arc(t.x, t.y, 38, 0, Math.PI * 2);
            ctx.strokeStyle = "#00FFFF";
            ctx.lineWidth = 4;
            ctx.stroke();

            const stats = towerStats[t.type] || defaultTower;
            const range = stats.range + t.rangeLevel * 10;
            ctx.beginPath();
            ctx.arc(t.x, t.y, range, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0, 0, 255, 0.15)";
            ctx.fill();
          }
        });
      }

      function lineIntersectsRect(x1, y1, x2, y2, rx, ry, rw, rh) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        let tMin = 0, tMax = 1;

        if (dx !== 0) {
          const t1 = (rx - x1) / dx;
          const t2 = (rx + rw - x1) / dx;
          tMin = Math.max(tMin, Math.min(t1, t2));
          tMax = Math.min(tMax, Math.max(t1, t2));
        } else if (x1 < rx || x1 > rx + rw) {
          return false;
        }

        if (dy !== 0) {
          const t1 = (ry - y1) / dy;
          const t2 = (ry + rh - y1) / dy;
          tMin = Math.max(tMin, Math.min(t1, t2));
          tMax = Math.min(tMax, Math.max(t1, t2));
        } else if (y1 < ry || y1 > ry + rh) {
          return false;
        }

        return tMax >= tMin;
      }

      function hasLineOfSight(x1, y1, x2, y2) {
        for (const obj of obstacles) {
          if (lineIntersectsRect(x1, y1, x2, y2, obj.x, obj.y, obj.width, obj.height)) {
            return false;
          }
        }
        return true;
      }

      function updateTowers(deltaTime) {
        if (isPaused) return;

        towers.forEach((tower) => {
          tower.cooldown = (tower.cooldown || 0) - deltaTime;
          const stats = towerStats[tower.type] || defaultTower;

          const range = stats.range + tower.rangeLevel * 10;
          const damage = stats.damage + tower.damageLevel * 10;
          const fireRate = stats.fireRate * Math.pow(0.9, tower.fireRateLevel);

          if (tower.cooldown <= 0) {
            let potentialTargets = enemies.filter((e) => {
              const dx = tower.x - e.x;
              const dy = tower.y - e.y;
              if (Math.hypot(dx, dy) > range) return false;
              if (stats.losBlocked && !hasLineOfSight(tower.x, tower.y, e.x, e.y)) return false;
              return true;
            });

            let target = null;
            if (tower.targetMode === "first") {
              target = potentialTargets[0];
            } else if (tower.targetMode === "last") {
              target = potentialTargets[potentialTargets.length - 1];
            } else if (tower.targetMode === "closest") {
              target = potentialTargets.reduce((closest, e) => {
                const dist = Math.hypot(tower.x - e.x, tower.y - e.y);
                return !closest || dist < closest.dist ? { e, dist } : closest;
              }, null)?.e;
            } else if (tower.targetMode === "strongest") {
              target = potentialTargets.reduce((strongest, e) => {
                return !strongest || e.hp > strongest.hp ? e : strongest;
              }, null);
            }

            if (target) {
              playSound("firing");
              projectiles.push({
                x: tower.x,
                y: tower.y,
                target,
                damage: damage,
                speed: PROJECTILE_SPEED,
              });
              tower.cooldown = fireRate;
            }
          }
        });
      }

      function gameLoop(now = performance.now()) {
        if (isPaused) {
          requestAnimationFrame(gameLoop);
          return;
        }

        const deltaTime = (now - lastTime) / 1000;
        lastTime = now;
        const maxDelta = 0.05; // This caps to 50ms or 20 fps
        const safeDelta = Math.min(deltaTime, maxDelta);
        const adjustedDelta = safeDelta * gameSpeed;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(background, 0, 0, canvas.width, canvas.height);

        drawObstacles();
        drawTowers();
        drawEnemies();
        updateProjectiles(adjustedDelta);
        updateTowers(adjustedDelta);
        updateEnemies(adjustedDelta);
        drawProjectiles();

        if (isDragging && ghostImage.complete) {
          const stats = towerStats[draggingTower] || defaultTower;
          const range = stats.range;

          ctx.beginPath();
          ctx.arc(mouseX, mouseY, range, 0, Math.PI * 2);
          ctx.fillStyle = canPlaceTower(mouseX, mouseY)
            ? "rgba(0,0,0,0.2)"
            : "rgba(255,0,0,0.3)";
          ctx.fill();

          ctx.globalAlpha = 0.6;
          ctx.drawImage(ghostImage, mouseX - TOWER_COLLISION_RADIUS, mouseY - TOWER_COLLISION_RADIUS, SPRITE_SIZE, SPRITE_SIZE);
          ctx.globalAlpha = 1.0;
        }

        requestAnimationFrame(gameLoop);
      }

      // Handles closing the sell confirmation popup
      window.closeSellPopup = function () {
        document.getElementById("sell-confirm-popup").style.display = "none";
      };

      // Handles confirming the sale and removing the tower
      document.getElementById("confirm-sell-btn").onclick = () => {
        if (!selectedTower) return;

        ui.addMoney(window._pendingSellRefund || 0);
        playSound("sell");

        const index = towers.indexOf(selectedTower);
        if (index !== -1) towers.splice(index, 1);

        selectedTower = null;
        hideUpgradeMenu();
        closeSellPopup();
      };

      window.cycleTargetMode = function () {
        if (!selectedTower) return;

        const modes = ["first", "last", "closest", "strongest"];
        const index = modes.indexOf(selectedTower.targetMode);
        selectedTower.targetMode = modes[(index + 1) % modes.length];

        showUpgradeMenu();
      };

      function distanceToSegment(p, v, w) {
        const l2 = (v.x - w.x) ** 2 + (v.y - w.y) ** 2;
        if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
        let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
        t = Math.max(0, Math.min(1, t));
        const proj = {
          x: v.x + t * (w.x - v.x),
          y: v.y + t * (w.y - v.y),
        };
        return Math.hypot(p.x - proj.x, p.y - proj.y);
      }

      function isNearPath(x, y, buffer = PATH_BUFFER) {
        for (let i = 0; i < path.length - 1; i++) {
          const p1 = path[i];
          const p2 = path[i + 1];
          const dist = distanceToSegment({ x, y }, p1, p2);
          if (dist < buffer) return true;
        }
        return false;
      }

      function isOnAnotherTower(x, y, minDist = TOWER_MIN_DISTANCE) {
        return towers.some((t) => Math.hypot(t.x - x, t.y - y) < minDist);
      }

      function isOnObstacle(x, y) {
        return obstacles.some(
          (obj) =>
            x > obj.x &&
            x < obj.x + obj.width &&
            y > obj.y &&
            y < obj.y + obj.height
        );
      }

      function isOnAllowedColor(x, y) {
        const pixel = offscreenCtx.getImageData(
          Math.floor(x),
          Math.floor(y),
          1,
          1
        ).data;

        return (
          Math.abs(pixel[0] - PLACEMENT_COLOR.r) <= COLOR_TOLERANCE &&
          Math.abs(pixel[1] - PLACEMENT_COLOR.g) <= COLOR_TOLERANCE &&
          Math.abs(pixel[2] - PLACEMENT_COLOR.b) <= COLOR_TOLERANCE &&
          pixel[3] === 255
        );
      }

      function canPlaceTower(x, y) {
        return (
          isOnAllowedColor(x, y) &&
          !isNearPath(x, y) &&
          !isOnAnotherTower(x, y) &&
          !isOnObstacle(x, y)
        );
      }

      background.onload = () => {
        resizeCanvas();
        offscreenCtx.drawImage(background, 0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
      };

      window.togglePause = togglePause;

      window.pauseGame = () => {
        isPaused = true;
      };
      window.resumeGame = () => {
        isPaused = false;
      };

      // Cancel tower placement
      function cancelPlacement() {
        isDragging = false;
        draggingTower = null;
      }

      // Right-click cancels placement
      canvas.addEventListener("contextmenu", (e) => {
        if (isDragging) {
          cancelPlacement();
          e.preventDefault();
        }
      });

      // Clicking the tower sidebar cancels placement
      document.addEventListener("click", (e) => {
        if (isDragging && e.target.closest("#tower-panel")) {
          cancelPlacement();
        }
      });

      // Hotkeys
      const hotkeyTowers = { "1": "cannon", "2": "shredder", "3": "sniper" };

      document.addEventListener("keydown", (e) => {
        // Ignore if typing in an input
        if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;

        if (hotkeyTowers[e.key]) {
          const type = hotkeyTowers[e.key];
          const price = towerPrices[type];
          if (ui.money >= price) {
            draggingTower = type;
            const img = document.querySelector(`[data-tower="${type}"]`);
            if (img) ghostImage.src = img.src;
            isDragging = true;
          }
          e.preventDefault();
        } else if (e.code === "Space") {
          if (!waveInProgress) window.startWave?.();
          e.preventDefault();
        } else if (e.key === "Escape") {
          if (isDragging) {
            cancelPlacement();
          } else {
            togglePause();
          }
          e.preventDefault();
        }
      });
    </script>
  </body>
</html>
