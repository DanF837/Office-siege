<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR Hallway</title>
    <link rel="stylesheet" href="../style.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      canvas {
        background: #000;
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas"></canvas>

    <script>
      fetch("../gameover.html")
        .then((res) => res.text())
        .then((html) => {
          document.body.insertAdjacentHTML("beforeend", html);
        });
    </script>

    <script>
      import { showGameOver, retryGame, goHome } from "../gameover.js";
      window.showGameOver = showGameOver;
      window.retryGame = retryGame;
      window.goHome = goHome;
    </script>

    <script type="module">
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      const VIRTUAL_WIDTH = 1920;
      const VIRTUAL_HEIGHT = 1080;

      const offscreenCanvas = document.createElement("canvas");
      offscreenCanvas.width = VIRTUAL_WIDTH;
      offscreenCanvas.height = VIRTUAL_HEIGHT;
      const offscreenCtx = offscreenCanvas.getContext("2d");

      const enemies = [];
      const enemySpeed = 100;

      let waveInProgress = false;

      function spawnEnemy() {
        enemies.push({
          x: path[0].x,
          y: path[0].y,
          waypointIndex: 1,
          speed: enemySpeed,
        });
      }

      function updateEnemies(deltaTime) {
        enemies.forEach((enemy, index) => {
          const target = path[enemy.waypointIndex];
          if (!target) return;

          const dx = target.x - enemy.x;
          const dy = target.y - enemy.y;
          const dist = Math.hypot(dx, dy);
          const moveDist = enemy.speed * deltaTime;

          if (dist < moveDist) {
            enemy.x = target.x;
            enemy.y = target.y;
            enemy.waypointIndex++;
          } else {
            enemy.x += (dx / dist) * moveDist;
            enemy.y += (dy / dist) * moveDist;
          }

          if (enemy.waypointIndex >= path.length) {
            enemies.splice(index, 1);
            console.log("Enemy reached the end!");

            import("../ui.js").then(mod => {
              mod.loseLife();
              if (mod.lives <= 0) {
                window.showGameOver();
              }
            });
          }
        });

        if (waveInProgress && enemies.length === 0) {
          waveInProgress = false;
          const btn = document.getElementById("start-btn");
          if (btn) btn.disabled = false;
          console.log("Wave ended");
        }
      }

      function drawEnemies() {
        ctx.fillStyle = "black";
        enemies.forEach((e) => {
          ctx.beginPath();
          ctx.arc(e.x, e.y, 20, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      // Load UI HTML
      fetch("../ui.html")
        .then((res) => res.text())
        .then((html) => {
          document.body.insertAdjacentHTML("beforeend", html);

          import("../ui.js").then((mod) => {
            if (typeof mod.updateUI === "function") {
              mod.updateUI();

              window.startWave = () => {
                if (waveInProgress) return;

                waveInProgress = true;
                document.getElementById("start-btn").disabled = true;

                console.log("Wave started");
                mod.startWave();

                for (let i = 0; i < 5; i++) {
                  setTimeout(spawnEnemy, i * 1000);
                }
              };

              window.togglePause = () => console.log("Pause toggled");
            } else {
              console.error("updateUI is not a function in ui.js");
            }
          });

          document.querySelectorAll("[data-tower]").forEach((img) => {
            img.addEventListener("dragstart", (e) => {
              draggingTower = e.target.dataset.tower;
              ghostImage.src = e.target.src;
              isDragging = true;
            });
          });
        });

      canvas.addEventListener("click", (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = VIRTUAL_WIDTH / rect.width;
        const scaleY = VIRTUAL_HEIGHT / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;
        console.log(`{ x: ${x}, y: ${y} },`);

        if (canPlaceTower(x, y)) {
          towers.push({ x, y, range: 100 });
        }
      });

      const background = new Image();
      background.src = "../assets/maps/hr_background.png";

      const path = [
        { x: 1657, y: 785 },
        { x: 1657, y: 958 },
        { x: 427, y: 958 },
        { x: 427, y: 608 },
        { x: 836, y: 608 },
        { x: 836, y: 862 },
        { x: 1090, y: 862 },
        { x: 1090, y: 635 },
        { x: 1410, y: 634 },
        { x: 1410, y: 459 },
        { x: 1641, y: 459 },
        { x: 1641, y: 330 },
        { x: 150, y: 326 },
        { x: 150, y: 610 },
        { x: 426, y: 610 },
        { x: 426, y: 955 },
        { x: 1655, y: 956 },
        { x: 1655, y: 786 },
      ];

      const obstacles = [
        { x: 840, y: 10, width: 70, height: 80 },
        { x: 50, y: 20, width: 80, height: 50 },
      ];

      const towers = [];

      let draggingTower = null;
      let ghostImage = new Image();
      let isDragging = false;
      let mouseX = 0,
        mouseY = 0;

      const towerImages = {
        cannon: new Image(),
        shredder: new Image(),
        sniper: new Image(),
      };

      towerImages.cannon.src = "../assets/tower/coffee_cannon.png";
      towerImages.shredder.src = "../assets/tower/paper_shredder.png";
      towerImages.sniper.src = "../assets/tower/monitor_sniper.png";

      let lastTime = performance.now();

      function resizeCanvas() {
        canvas.width = VIRTUAL_WIDTH;
        canvas.height = VIRTUAL_HEIGHT;
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        gameLoop();
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      canvas.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = VIRTUAL_WIDTH / rect.width;
        const scaleY = VIRTUAL_HEIGHT / rect.height;
        mouseX = (e.clientX - rect.left) * scaleX;
        mouseY = (e.clientY - rect.top) * scaleY;
      });

      canvas.addEventListener("mouseup", (e) => {
        if (isDragging && draggingTower) {
          const rect = canvas.getBoundingClientRect();
          const scaleX = VIRTUAL_WIDTH / rect.width;
          const scaleY = VIRTUAL_HEIGHT / rect.height;
          const x = (e.clientX - rect.left) * scaleX;
          const y = (e.clientY - rect.top) * scaleY;
          if (canPlaceTower(x, y)) {
            towers.push({ x, y, type: draggingTower, range: 100 });
          }
          isDragging = false;
          draggingTower = null;
        }
      });
      /*
      function drawPath() {
        ctx.strokeStyle = "red";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(path[0].x, path[0].y);
        for (let i = 1; i < path.length; i++) {
          ctx.lineTo(path[i].x, path[i].y);
        }
        ctx.stroke();
      } 
      */
      function drawObstacles() {
        ctx.fillStyle = "rgba(120, 120, 120, 0.6)";
        obstacles.forEach((obj) =>
          ctx.fillRect(obj.x, obj.y, obj.width, obj.height)
        );
      }

      function drawTowers() {
        towers.forEach((t) => {
          const img = towerImages[t.type];
          if (img && img.complete) {
            ctx.drawImage(towerImages[t.type], t.x - 32, t.y - 32, 64, 64);
          }
        });
      }

      function gameLoop(now = performance.now()) {
        const deltaTime = (now - lastTime) / 1000;
        lastTime = now;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(background, 0, 0, canvas.width, canvas.height);

        drawObstacles();
        drawTowers();
        drawEnemies();
        updateEnemies(deltaTime);

        if (isDragging && ghostImage.complete) {
          ctx.globalAlpha = 0.6;
          ctx.drawImage(ghostImage, mouseX - 32, mouseY - 32, 64, 64);
          ctx.globalAlpha = 1.0;
        }

        requestAnimationFrame(gameLoop);
      }

      function distanceToSegment(p, v, w) {
        const l2 = (v.x - w.x) ** 2 + (v.y - w.y) ** 2;
        if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
        let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
        t = Math.max(0, Math.min(1, t));
        const proj = {
          x: v.x + t * (w.x - v.x),
          y: v.y + t * (w.y - v.y),
        };
        return Math.hypot(p.x - proj.x, p.y - proj.y);
      }

      function isNearPath(x, y, buffer = 30) {
        for (let i = 0; i < path.length - 1; i++) {
          const p1 = path[i];
          const p2 = path[i + 1];
          const dist = distanceToSegment({ x, y }, p1, p2);
          if (dist < buffer) return true;
        }
        return false;
      }

      function isOnAnotherTower(x, y, minDist = 50) {
        return towers.some((t) => Math.hypot(t.x - x, t.y - y) < minDist);
      }

      function isOnObstacle(x, y) {
        return obstacles.some(
          (obj) =>
            x > obj.x &&
            x < obj.x + obj.width &&
            y > obj.y &&
            y < obj.y + obj.height
        );
      }

      function isOnAllowedColor(x, y) {
        const pixel = offscreenCtx.getImageData(
          Math.floor(x),
          Math.floor(y),
          1,
          1
        ).data;
        const target = { r: 194, g: 154, b: 85 };
        const tolerance = 10;

        return (
          Math.abs(pixel[0] - target.r) <= tolerance &&
          Math.abs(pixel[1] - target.g) <= tolerance &&
          Math.abs(pixel[2] - target.b) <= tolerance &&
          pixel[3] === 255
        );
      }

      function canPlaceTower(x, y) {
        return (
          isOnAllowedColor(x, y) &&
          !isNearPath(x, y) &&
          !isOnAnotherTower(x, y) &&
          !isOnObstacle(x, y)
        );
      }

      background.onload = () => {
        resizeCanvas();
        offscreenCtx.drawImage(background, 0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
      };
    </script>
  </body>
</html>
