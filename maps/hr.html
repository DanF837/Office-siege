<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR Hallway</title>
    <link rel="stylesheet" href="../style.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      canvas {
        background: #000;
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas"></canvas>

    <script type="module">
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      // Load UI HTML
      fetch("../ui.html")
        .then((res) => res.text())
        .then((html) => {
          document.body.insertAdjacentHTML("beforeend", html);

          import("../js/ui.js").then((mod) => {
            if (typeof mod.updateUI === "function") {
              mod.updateUI();
              window.startWave = mod.startWave;
              window.togglePause = () => console.log("Pause toggled");
            } else {
              console.error("updateUI is not a function in ui.js");
            }
          });

          // Setup drag listeners
          document.querySelectorAll("[data-tower]").forEach((img) => {
            img.addEventListener("dragstart", (e) => {
              draggingTower = e.target.dataset.tower;
              ghostImage.src = e.target.src;
              isDragging = true;
            });
          });
        });

      const background = new Image();
      background.src = "../assets/maps/hr_background.png";

      const path = [
        { x: 820, y: 470 },
        { x: 820, y: 560 },
        { x: 720, y: 560 },
        { x: 470, y: 560 },
        { x: 215, y: 560 },
        { x: 215, y: 360 },
        { x: 420, y: 360 },
        { x: 420, y: 510 },
        { x: 545, y: 510 },
        { x: 545, y: 380 },
        { x: 705, y: 380 },
        { x: 705, y: 270 },
        { x: 820, y: 270 },
        { x: 820, y: 195 },
        { x: 75, y: 195 },
        { x: 75, y: 365 },
        { x: 210, y: 365 },
        { x: 210, y: 575 },
        { x: 830, y: 575 },
        { x: 830, y: 470 },
      ];

      const obstacles = [
        { x: 840, y: 10, width: 70, height: 80 },
        { x: 50, y: 20, width: 80, height: 50 },
      ];

      const towers = [];

      let draggingTower = null;
      let ghostImage = new Image();
      let isDragging = false;
      let mouseX = 0,
        mouseY = 0;

      const towerImages = {
        cannon: new Image(),
        shredder: new Image(),
        sniper: new Image(),
      };

      towerImages.cannon.src = "../assets/tower/coffee_cannon.png";
      towerImages.shredder.src = "../assets/tower/paper_shredder.png";
      towerImages.sniper.src = "../assets/tower/monitor_sniper.png";

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        gameLoop();
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      canvas.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        mouseX = e.clientX - rect.left;
        mouseY = e.clientY - rect.top;
      });

      canvas.addEventListener("mouseup", () => {
        if (isDragging && draggingTower) {
          if (canPlaceTower(mouseX, mouseY)) {
            towers.push({
              x: mouseX,
              y: mouseY,
              type: draggingTower,
              range: 100,
            });
          }
          isDragging = false;
          draggingTower = null;
        }
      });

      function drawPath() {
        ctx.strokeStyle = "red";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(path[0].x, path[0].y);
        for (let i = 1; i < path.length; i++) {
          ctx.lineTo(path[i].x, path[i].y);
        }
        ctx.stroke();
      }

      function drawObstacles() {
        ctx.fillStyle = "rgba(120, 120, 120, 0.6)";
        obstacles.forEach((obj) =>
          ctx.fillRect(obj.x, obj.y, obj.width, obj.height)
        );
      }

      function drawTowers() {
        towers.forEach((t) => {
          const img = towerImages[t.type];
          if (img && img.complete) {
            ctx.drawImage(towerImages[t.type], t.x - 32, t.y - 32, 64, 64); // center the image
          } else {
            // fallback circle if image not loaded
            ctx.fillStyle = "#333";
            ctx.beginPath();
            ctx.arc(t.x, t.y, 20, 0, Math.PI * 2);
            ctx.fill();
          }
        });
      }

      function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(background, 0, 0, canvas.width, canvas.height);
        drawPath();
        drawObstacles();
        drawTowers();
        if (isDragging && ghostImage.complete) {
          ctx.globalAlpha = 0.6;
          ctx.drawImage(ghostImage, mouseX - 28, mouseY - 28, 56, 56);
          ctx.globalAlpha = 1.0;
        }
        requestAnimationFrame(gameLoop);
      }

      function distanceToSegment(p, v, w) {
        const l2 = (v.x - w.x) ** 2 + (v.y - w.y) ** 2;
        if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
        let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
        t = Math.max(0, Math.min(1, t));
        const proj = {
          x: v.x + t * (w.x - v.x),
          y: v.y + t * (w.y - v.y),
        };
        return Math.hypot(p.x - proj.x, p.y - proj.y);
      }

      function isNearPath(x, y, buffer = 30) {
        for (let i = 0; i < path.length - 1; i++) {
          const p1 = path[i];
          const p2 = path[i + 1];
          const dist = distanceToSegment({ x, y }, p1, p2);
          if (dist < buffer) return true;
        }
        return false;
      }

      function isOnAnotherTower(x, y, minDist = 50) {
        return towers.some((t) => Math.hypot(t.x - x, t.y - y) < minDist);
      }

      function isOnObstacle(x, y) {
        return obstacles.some(
          (obj) =>
            x > obj.x &&
            x < obj.x + obj.width &&
            y > obj.y &&
            y < obj.y + obj.height
        );
      }

      function canPlaceTower(x, y) {
        return (
          !isNearPath(x, y) && !isOnAnotherTower(x, y) && !isOnObstacle(x, y)
        );
      }

      background.onload = () => resizeCanvas();
    </script>
  </body>
</html>
