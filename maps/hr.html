<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR Hallway</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      canvas {
        background: #000;
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas"></canvas>

    <div
      id="game-over-screen"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        color: white;
        font-size: 32px;
        font-family: sans-serif;">
      <h1 style="margin-bottom: 20px">Game Over</h1>
      <div style="display: flex; gap: 20px">
        <button onclick="retryGame()" style="padding: 10px 20px">Retry</button>
        <button onclick="goHome()" style="padding: 10px 20px">Home</button>
      </div>
    </div>

    <div id="pause-popup"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        z-index: 9999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: sans-serif;
        color: white;
        font-size: 28px;
      ">
      <p>Paused</p>
      <div style="margin-top: 20px">
        <button onclick="togglePause()" style="padding: 10px 20px; margin: 5px">Return to Game</button>
        <button onclick="goHome()" style="padding: 10px 20px; margin: 5px">Home</button>
      </div>
    </div>


    <div id="upgrade-menu" 
      style="
        position: fixed;
        bottom: 20px;
        left: 20px;
        background: #222;
        padding: 10px;
        color: white;
        z-index: 10000;
        display: none;
      ">
      <p>Upgrade Tower</p>
      <button onclick="upgradeStat('range')">+Range</button>
      <button onclick="upgradeStat('damage')">+Damage</button>
      <button onclick="upgradeStat('fireRate')">+Fire Rate</button>
    </div>

    <div id="victory-screen"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.9);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        color: white;
        font-size: 32px;
        font-family: sans-serif;">
      <h1 style="margin-bottom: 20px"> HR Boss Defeated!</h1>
      <p>You’ve survived the bureaucracy.</p>
      <div style="margin-top: 30px; display: flex; gap: 20px;">
        <button onclick="continueGame()" style="padding: 10px 25px;">Continue Playing</button>
        <button onclick="goHome()" style="padding: 10px 25px;">Return to Menu</button>
      </div>
    </div>

    <!-- Sell Confirmation Popup -->
    <div id="sell-confirm-popup"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0,0,0,0.85);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10001;
        color: white;
        font-family: sans-serif;
      ">
      <p id="sell-message" style="font-size: 24px; margin-bottom: 20px;"></p>
      <div style="display: flex; gap: 20px;">
        <button id="confirm-sell-btn" style="padding: 10px 20px; background: #a00; color: white;">Yes, Sell</button>
        <button onclick="closeSellPopup()" style="padding: 10px 20px;">Cancel</button>
      </div>
    </div>

    <div id="message-popup"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0,0,0,0.85);
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10001;
        color: white;
        font-family: sans-serif;
      ">
      <p id="message-text" style="font-size: 24px; margin-bottom: 20px;"></p>
      <button onclick="closeMessagePopup()" style="padding: 10px 20px;">OK</button>
    </div>

    <script>
      let victoryShown = false;

      function showGameOver() {
        document.getElementById("game-over-screen").style.display = "flex";
      }

      function retryGame() {
        location.reload();
      }

      function goHome() {
        window.location.href = "../hub.html";
      }

      function showVictoryScreen() {
        if (victoryShown) return;
        victoryShown = true;
        document.getElementById("victory-screen").style.display = "flex";
        isPaused = true;
      }

      function continueGame() {
        document.getElementById("victory-screen").style.display = "none";
        isPaused = false;
        waveInProgress = false;
        allEnemiesSpawned = false;
        const btn = document.getElementById("start-btn");
        if (btn) {
          btn.disabled = false;
          btn.onclick = () => startWave(); 
        }
      }

      window.showVictoryScreen = showVictoryScreen;
      window.continueGame = continueGame;
      window.showGameOver = showGameOver;
      window.retryGame = retryGame;
      window.goHome = goHome;
      window.showMessagePopup = function (text) {
        document.getElementById("message-text").innerText = text;
        document.getElementById("message-popup").style.display = "flex";
      };
      window.closeMessagePopup = function () {
        document.getElementById("message-popup").style.display = "none";
      };
    </script>

    <script type="module">

    import { playSound } from "../js/gameAudio.js";


      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      const VIRTUAL_WIDTH = 1920;
      const VIRTUAL_HEIGHT = 1080;

      const offscreenCanvas = document.createElement("canvas");
      offscreenCanvas.width = VIRTUAL_WIDTH;
      offscreenCanvas.height = VIRTUAL_HEIGHT;
      const offscreenCtx = offscreenCanvas.getContext("2d");

      const enemies = [];
      const enemySpeed = 100;
      const enemyTypes = {
        normal : { hp: 100, speed: 100, reward: 1 },
        fast: { hp: 60, speed: 180, reward: 1 },
        tank: { hp: 300, speed: 60, reward: 1 },
        boss: { hp: 10000, speed: 40, reward: 1000 },
      }

      const enemySprites = {
        normal: new Image(),
        fast: new Image(),
        tank: new Image(),
        boss: new Image(),
      };

      const towerPrices = {
        cannon: 100,
        shredder: 75,
        sniper: 150,
      };

      enemySprites.normal.src = "../assets/enemy/enemy_normal.png";
      enemySprites.fast.src = "../assets/enemy/enemy_fast.png";
      enemySprites.tank.src = "../assets/enemy/enemy_tank.png";
      enemySprites.boss.src = "../assets/enemy/enemy_boss.png";
   
      let currentWave = 0;

      let waveInProgress = false;
      let allEnemiesSpawned = false;
      let selectedTower = null;
      let isPaused = false;

      function togglePause() {
        isPaused = !isPaused;
        const popup = document.getElementById("pause-popup");
        if (popup) popup.style.display = isPaused ? "flex": "none";
      }

      function resumeGame() {
        isPaused = false;
        const popup = document.getElementById("pause-popup");
        if (popup) popup.style.display = "none";
      }

      const projectiles = [];

      function spawnEnemy() {
        enemies.push({
          x: path[0].x,
          y: path[0].y,
          waypointIndex: 1,
          speed: enemySpeed,
          hp: 100,
        });
      }

      function updateEnemies(deltaTime) {
        if (isPaused) return;
        for (let i = enemies.length - 1; i >= 0; i--) {
          const enemy = enemies[i];
          const target = path[enemy.waypointIndex];
          if (!target) continue;

          const dx = target.x - enemy.x;
          const dy = target.y - enemy.y;
          const dist = Math.hypot(dx, dy);
          const moveDist = enemy.speed * deltaTime;

          if (dist < moveDist) {
            enemy.x = target.x;
            enemy.y = target.y;
            enemy.waypointIndex++;
          } else {
            enemy.x += (dx / dist) * moveDist;
            enemy.y += (dy / dist) * moveDist;
          }

          if (enemy.hp <= 0) {
            enemies.splice(i, 1);
            import("../ui.js").then((mod) => mod.addMoney(enemy.reward));
            continue;
          }

          if (enemy.waypointIndex >= path.length) {
            enemies.splice(i, 1);
            import("../ui.js").then((mod) => {
              mod.loseLife();
              if (mod.lives <= 0) showGameOver();
            });
          }
        }

        if (waveInProgress && allEnemiesSpawned && enemies.length === 0) {

          if (currentWave === 25 && !victoryShown) {
            showVictoryScreen();
          }

          waveInProgress = false;
          allEnemiesSpawned = false;

          // Giving user 100 for completing wave
          import("../ui.js").then((mod) => mod.addMoney(100));


          const btn = document.getElementById("start-btn");
          if (btn) btn.disabled = false;
        }
      }

      function showUpgradeMenu() {
        const menu = document.getElementById("upgrade-menu");

        if (selectedTower) {
          const baseCost = 100;
          const maxLevel = 10;

          const moneyPromise = import("../ui.js").then((mod) => mod.money);
          moneyPromise.then((money) => {
            const levels = {
              range: selectedTower.rangeLevel,
              damage: selectedTower.damageLevel,
              fireRate: selectedTower.fireRateLevel,
            };

            const costs = {
              range: levels.range >= maxLevel ? null : Math.round(baseCost * Math.pow(1.5, levels.range - 1) / 10) * 10,
              damage: levels.damage >= maxLevel ? null : Math.round(baseCost * Math.pow(1.5, levels.damage - 1) / 10) * 10,
              fireRate: levels.fireRate >= maxLevel ? null : Math.round(baseCost * Math.pow(1.5, levels.fireRate - 1) / 10) * 10,
            };

            const buttonHTML = (stat, label, desc) => {
              const level = levels[stat];
              const cost = costs[stat];

              if (level >= maxLevel) {
                return `<button disabled title="Already at max level">${label} (MAX)</button>`;
              }

              const disabled = cost > money ? "disabled style='opacity: 0.5; cursor: not-allowed;'" : "";
              return `<button onclick="upgradeStat('${stat}')" ${disabled} title="${desc}">${label} ($${cost})</button>`;
            };

            menu.innerHTML = `
              <p>Upgrade Tower</p>
              ${buttonHTML("range", "+Range", "Increases tower range by +10 units")}
              ${buttonHTML("damage", "+Damage", "Increases tower damage by +10")}
              ${buttonHTML("fireRate", "+Fire Rate", "Improves fire rate (faster shooting)")}
              <p style="margin-top: 10px;">Targeting: <strong>${selectedTower.targetMode.toUpperCase()}</strong></p>
              <button onclick="cycleTargetMode()" style="padding: 5px 10px;">Change Mode</button>
              <button onclick="sellSelectedTower()" style="margin-top: 10px; background: #a00;">Sell Tower</button>
            `;
            menu.style.display = "block";
          });
        }
      }

      window.refreshUpgradeMenu = function () {
        if (document.getElementById("upgrade-menu").style.display === "block") {
          showUpgradeMenu();
        }
      };

      function hideUpgradeMenu() {
        const menu = document.getElementById("upgrade-menu");
        menu.style.display = "none";
      }

      window.upgradeStat = function(stat) {
        if (!selectedTower) return;

        const baseCost = 100;
        const maxLevel = 10;
        const currentLevel = selectedTower[stat + "Level"];

        if (currentLevel >= maxLevel) {
          alert("Max upgrade level reached.");
          return;
        }

        const cost = Math.round(baseCost * Math.pow(1.5, currentLevel - 1) / 10) * 10;

        import("../ui.js").then((mod) => {
          if (mod.money >= cost) {
            mod.addMoney(-cost);
            selectedTower[stat + "Level"]++;

            import("../js/gameAudio.js").then((audio) => audio.playSound("upgrade"));
            showUpgradeMenu(); 
          }
        });
      };

      window.sellSelectedTower = function () {
        if (!selectedTower) return;

        const baseCost = 100;
        const upgradeCost = 100;
        const basePrice = towerPrices[selectedTower.type];

        const totalLevels = (selectedTower.rangeLevel - 1)
                        + (selectedTower.damageLevel - 1)
                        + (selectedTower.fireRateLevel - 1);

        const totalSpent = basePrice + (totalLevels * upgradeCost);
        const refund = Math.floor(totalSpent / 2);

        // Save refund amount for use in confirmation
        window._pendingSellRefund = refund;
        document.getElementById("sell-message").innerText = `Sell this tower for $${refund}?`;

        document.getElementById("sell-confirm-popup").style.display = "flex";
      };

      function updateProjectiles(deltaTime) {
        if (isPaused) return;
        for (let i = projectiles.length - 1; i >= 0; i--) {
          const p = projectiles[i];

          if (!enemies.includes(p.target) || p.target.hp <= 0) {
            projectiles.splice(i, 1);
            continue;
          }

          const dx = p.target.x - p.x;
          const dy = p.target.y - p.y;
          const dist = Math.hypot(dx, dy);
          const moveDist = p.speed * deltaTime;

          if (dist < moveDist) {
            p.target.hp -= p.damage;
            projectiles.splice(i, 1);
            playSound("hit");
            continue;
          }

          p.x += (dx / dist) * moveDist;
          p.y += (dy / dist) * moveDist;
        }
      }

      function drawEnemies() {
        enemies.forEach((e) => {
          const sprite = enemySprites[e.type] || enemySprites.normal;
          const size = 64;
          if (sprite.complete) {
            ctx.drawImage(sprite, e.x - size / 2, e.y - size / 2, size, size);
          }

          // Health bar background
          const barWidth = 40;
          const barHeight = 6;
          const maxHp = e.maxHp || 100;
          const hpRatio = e.hp / maxHp;

          ctx.fillStyle = "red";
          ctx.fillRect(e.x - barWidth / 2, e.y - 30, barWidth, barHeight);

          ctx.fillStyle = "lime";
          ctx.fillRect(e.x - barWidth / 2, e.y - 30, barWidth * hpRatio, barHeight);

          ctx.strokeStyle = "black";
          ctx.strokeRect(e.x - barWidth / 2, e.y - 30, barWidth, barHeight);
        });
      }

      function drawProjectiles() {
        ctx.fillStyle = "orange";
        projectiles.forEach((p) => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      // Load UI HTML
      fetch("../ui.html")
        .then((res) => res.text())
        .then((html) => {
          document.body.insertAdjacentHTML("beforeend", html);

          import("../ui.js").then((mod) => {
            if (typeof mod.updateUI === "function") {
              mod.updateUI();

              function generateWave(waveNum) {
                if (waveNum === 25) {
                  return {
                    enemies: [
                      {
                        type: "boss",
                        hp: 10000,
                        speed: 40,
                        reward: 1000,
                        count: 1
                      }
                    ]
                  };
                }

                const enemyTypes = ["normal", "fast", "tank"];
                const count = Math.floor(10 + waveNum * 1.25);

                const enemies = [];

                for (let i = 0; i < count; i++) {
                  const type = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
                  let hp, speed, reward;

                  if (type === "normal") {
                    hp = Math.floor(100 * Math.pow(1.05, waveNum));
                    speed = 100;
                    reward = 1;
                  } else if (type === "fast") {
                    hp = Math.floor(60 * Math.pow(1.04, waveNum));
                    speed = 180;
                    reward = 1;
                  } else if (type === "tank") {
                    hp = Math.floor(300 * Math.pow(1.08, waveNum));
                    speed = 60;
                    reward = 2;
                  }

                  enemies.push({ type, hp, speed, reward, count: 1 });
                }

                return { enemies };
              }

              window.startWave = () => {
                if (waveInProgress) return;

                isPaused = false;
                currentWave++;

                const waveData = generateWave(currentWave);
                let enemyQueue = [];

                waveData.enemies.forEach((entry) => {
                  for (let i = 0; i < entry.count; i++) {
                    enemyQueue.push({ ...entry });
                  }
                });

                waveInProgress = true;
                allEnemiesSpawned = false;
                document.getElementById("start-btn").disabled = true;

                import("../ui.js").then((mod) => mod.startWave()); // optional UI trigger

                let spawned = 0;
                const spawnInterval = setInterval(() => {
                  if (isPaused) return;

                  const enemy = enemyQueue[spawned];
                  enemies.push({
                    x: path[0].x,
                    y: path[0].y,
                    waypointIndex: 1,
                    speed: enemy.speed,
                    hp: enemy.hp,
                    maxHp: enemy.hp,
                    type: enemy.type,
                    reward: enemy.reward,
                  });

                  spawned++;
                  if (spawned >= enemyQueue.length) {
                    allEnemiesSpawned = true;
                    clearInterval(spawnInterval);
                  }
                }, 800);
              };


              document.querySelectorAll("[data-tower]").forEach((img) => {
                img.addEventListener("dragstart", (e) => {
                  draggingTower = e.target.dataset.tower;
                  ghostImage.src = e.target.src;
                  isDragging = true;
                });
              });    
            }
          });  
        }); 

      canvas.addEventListener("click", (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = VIRTUAL_WIDTH / rect.width;
        const scaleY = VIRTUAL_HEIGHT / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;

        if (isDragging && canPlaceTower(x, y)) {
          import("../ui.js").then((mod) => {
            const price = towerPrices[draggingTower];
            if (mod.money >= price) {
              mod.addMoney(-price);
              towers.push({
                x,
                y,
                type: draggingTower,
                level: 1,
                rangeLevel: 1,
                damageLevel: 1,
                fireRateLevel: 1,
                cooldown: 0,
                targetMode: 'first',
              });

              playSound("place");
            } else {
              showMessagePopup("Not enough money to place this tower.");
            }
            isDragging = false;
            draggingTower = null;
          });

          return;
        }

        selectedTower = towers.find((t) => Math.hypot(t.x - x, t.y - y) < 32) || null;

        if (selectedTower) {
          showUpgradeMenu();
        } else {
          hideUpgradeMenu();
        }
      });

      const background = new Image();
      background.src = "../assets/maps/hr_background.png";

      const path = [
        { x: 1657, y: 785 },
        { x: 1657, y: 958 },
        { x: 427, y: 958 },
        { x: 427, y: 608 },
        { x: 836, y: 608 },
        { x: 836, y: 862 },
        { x: 1090, y: 862 },
        { x: 1090, y: 635 },
        { x: 1410, y: 634 },
        { x: 1410, y: 459 },
        { x: 1641, y: 459 },
        { x: 1641, y: 330 },
        { x: 150, y: 326 },
        { x: 150, y: 610 },
        { x: 426, y: 610 },
        { x: 426, y: 955 },
        { x: 1655, y: 956 },
        { x: 1655, y: 786 },
      ];

      const obstacles = [
        { x: 840, y: 10, width: 70, height: 80 },
        { x: 50, y: 20, width: 80, height: 50 },
      ];

      const towers = [];

      let draggingTower = null;
      let ghostImage = new Image();
      let isDragging = false;
      let mouseX = 0,
        mouseY = 0;

      const towerImages = {
        cannon: new Image(),
        shredder: new Image(),
        sniper: new Image(),
      };

      towerImages.cannon.src = "../assets/tower/coffee_cannon.png";
      towerImages.shredder.src = "../assets/tower/paper_shredder.png";
      towerImages.sniper.src = "../assets/tower/monitor_sniper.png";

      let lastTime = performance.now();

      function resizeCanvas() {
        canvas.width = VIRTUAL_WIDTH;
        canvas.height = VIRTUAL_HEIGHT;
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        gameLoop();
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      canvas.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = VIRTUAL_WIDTH / rect.width;
        const scaleY = VIRTUAL_HEIGHT / rect.height;
        mouseX = (e.clientX - rect.left) * scaleX;
        mouseY = (e.clientY - rect.top) * scaleY;
      });

      /*
      function drawPath() {
        ctx.strokeStyle = "red";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(path[0].x, path[0].y);
        for (let i = 1; i < path.length; i++) {
          ctx.lineTo(path[i].x, path[i].y);
        }
        ctx.stroke();
      } 
      */
      function drawObstacles() {
        ctx.fillStyle = "rgba(120, 120, 120, 0.6)";
        obstacles.forEach((obj) =>
          ctx.fillRect(obj.x, obj.y, obj.width, obj.height)
        );
      }

      function drawTowers() {
        towers.forEach((t) => {
          const img = towerImages[t.type];
          if (img && img.complete) {
            ctx.drawImage(towerImages[t.type], t.x - 32, t.y - 32, 64, 64);
          }

          if (t === selectedTower) {

            ctx.beginPath();
            ctx.arc(t.x, t.y, 38, 0, Math.PI * 2);
            ctx.strokeStyle = "#00FFFF"; // Cyan or any color you like
            ctx.lineWidth = 4;
            ctx.stroke();

            const stats = towerStats[t.type] || defaultTower;
            const range = stats.range + t.rangeLevel * 10;
            const damage = stats.damage + t.damageLevel * 10;
            const fireRate = stats.fireRate * Math.pow(0.9, t.fireRateLevel);
            ctx.beginPath();
            ctx.arc(t.x, t.y, range, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0, 0, 255, 0.15)";
            ctx.fill();
          }
        });
      }

      function updateTowers(deltaTime) {
        if (isPaused) return;

        towers.forEach((tower) => {
          tower.cooldown = (tower.cooldown || 0) - deltaTime;
          const stats = towerStats[tower.type] || defaultTower;

          const range = stats.range + tower.rangeLevel * 10;
          const damage = stats.damage + tower.damageLevel * 10;
          const fireRate = stats.fireRate * Math.pow(0.9, tower.fireRateLevel);

          if (tower.cooldown <= 0) {

            let potentialTargets = enemies.filter((e) => {
              const dx = tower.x - e.x;
              const dy = tower.y - e.y;
              return Math.hypot(dx, dy) <= range;
            });

            let target = null;
            if (tower.targetMode === 'first') {
              target = potentialTargets[0];
            } else if (tower.targetMode === 'last') {
              target = potentialTargets[potentialTargets.length - 1];
            } else if (tower.targetMode === 'closest') {
              target = potentialTargets.reduce((closest, e) => {
                const dist = Math.hypot(tower.x - e.x, tower.y - e.y);
                return !closest || dist < closest.dist ? { e, dist } : closest;
              }, null)?.e;
            } else if (tower.targetMode === 'strongest') {
              target = potentialTargets.reduce((strongest, e) => {
                return !strongest || e.hp > strongest.hp ? e : strongest;
              }, null);
            }

            if (target) {
              playSound("firing");
              projectiles.push({
                x: tower.x,
                y: tower.y,
                target,
                damage: damage,
                speed: 600,
              });
              tower.cooldown = fireRate;
            }
          }
        });
      }

      const towerStats = {
        cannon: { range: 180, damage: 25, fireRate: 1 },
        sniper: { range: 99999999, damage: 100, fireRate: 6 },
        shredder: { range: 180, damage: 10, fireRate: 0.25 },
      };

      const defaultTower = { range: 100, damage: 20, fireRate: 1 };

      function gameLoop(now = performance.now()) {
        if (isPaused) {
          requestAnimationFrame(gameLoop);
          return;
        }

        const deltaTime = (now - lastTime) / 1000;
        lastTime = now;
        const maxDelta = 0.05; // THis caps to 50ms or 20 fps
        const safeDelta = Math.min(deltaTime, maxDelta);

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(background, 0, 0, canvas.width, canvas.height);

        drawObstacles();
        drawTowers();
        drawEnemies();
        updateProjectiles(safeDelta);
        updateTowers(safeDelta);
        updateEnemies(safeDelta);
        drawProjectiles();

        if (isDragging && ghostImage.complete) {
          const stats = towerStats[draggingTower] || defaultTower;
          const range = stats.range;

          // Drawing the range circle
          ctx.beginPath();
          ctx.arc(mouseX, mouseY, range, 0, Math.PI * 2);
          ctx.fillStyle = canPlaceTower(mouseX, mouseY)
            ? "rgba(0,0,0,0.2)"
            : "rgba(255,0,0,0.3)";
          ctx.fill();

          // Drawing ghost image
          ctx.globalAlpha = 0.6;
          ctx.drawImage(ghostImage, mouseX - 32, mouseY - 32, 64, 64);
          ctx.globalAlpha = 1.0;
        }

        requestAnimationFrame(gameLoop);
      }

      // Handles closing the sell confirmation popup
      window.closeSellPopup = function () {
        document.getElementById("sell-confirm-popup").style.display = "none";
      };

      // Handles confirming the sale and removing the tower
      document.getElementById("confirm-sell-btn").onclick = () => {
        if (!selectedTower) return;

        import("../ui.js").then((mod) => {
          mod.addMoney(window._pendingSellRefund || 0);
        });

        import("../js/gameAudio.js").then((audio) => audio.playSound("sell"));

        const index = towers.indexOf(selectedTower);
        if (index !== -1) towers.splice(index, 1);

        selectedTower = null;
        hideUpgradeMenu();
        closeSellPopup();
      };

      window.cycleTargetMode = function () {
        if (!selectedTower) return;

        const modes = ['first', 'last', 'closest', 'strongest'];
        const index = modes.indexOf(selectedTower.targetMode);
        selectedTower.targetMode = modes[(index + 1) % modes.length];

        showUpgradeMenu(); // Refresh The UI
      };

      function distanceToSegment(p, v, w) {
        const l2 = (v.x - w.x) ** 2 + (v.y - w.y) ** 2;
        if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
        let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
        t = Math.max(0, Math.min(1, t));
        const proj = {
          x: v.x + t * (w.x - v.x),
          y: v.y + t * (w.y - v.y),
        };
        return Math.hypot(p.x - proj.x, p.y - proj.y);
      }

      function isNearPath(x, y, buffer = 30) {
        for (let i = 0; i < path.length - 1; i++) {
          const p1 = path[i];
          const p2 = path[i + 1];
          const dist = distanceToSegment({ x, y }, p1, p2);
          if (dist < buffer) return true;
        }
        return false;
      }

      function isOnAnotherTower(x, y, minDist = 50) {
        return towers.some((t) => Math.hypot(t.x - x, t.y - y) < minDist);
      }

      function isOnObstacle(x, y) {
        return obstacles.some(
          (obj) =>
            x > obj.x &&
            x < obj.x + obj.width &&
            y > obj.y &&
            y < obj.y + obj.height
        );
      }

      function isOnAllowedColor(x, y) {
        const pixel = offscreenCtx.getImageData(Math.floor(x),Math.floor(y),1,1).data;
        const target = { r: 194, g: 154, b: 85 };
        const tolerance = 10;

        return (
          Math.abs(pixel[0] - target.r) <= tolerance &&
          Math.abs(pixel[1] - target.g) <= tolerance &&
          Math.abs(pixel[2] - target.b) <= tolerance &&
          pixel[3] === 255
        );
      }

      function canPlaceTower(x, y) {
        return (
          isOnAllowedColor(x, y) &&
          !isNearPath(x, y) &&
          !isOnAnotherTower(x, y) &&
          !isOnObstacle(x, y)
        );
      }

      background.onload = () => {
        resizeCanvas();
        offscreenCtx.drawImage(background, 0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
      };

      window.togglePause = togglePause;
    </script>
  </body>
</html>
