<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Office Siege – Mission Hub</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="hub-header">
      <h1 class="title">📍 Mission Hub</h1>
      <p class="tagline">Select your department and prepare your loadout.</p>
    </header>

    <!-- MAIN CONTENT GRID -->
    <main class="hub-main">
      <!-- LEFT: MAP SELECT -->
      <section class="panel map-panel">
        <h3>🗺 Map Select</h3>
        <button onclick="selectMap('hr')">HR Hallway</button>
<!--        <button onclick="selectMap('it')">IT Overload</button>  -->
      </section> 

      <!-- CENTER: OVERVIEW -->
      <section class="panel overview-panel">
        <h3>🖥 Overview</h3>
        <p id="mapDescription">Select a map to see its tactical overview.</p>
        <hr />
        <p class="note">Latest News: New map "IT Overload" coming soon!</p>
      </section>

      <!-- RIGHT: TOWER LOADOUT -->
      <section class="panel tower-panel">
        <h3>🛡 Towers</h3>
        <div class="tower-list">
          <div class="tower-icon" title="Coffee Cannon">
            <img src="assets/tower/coffee_cannon.png" alt="Coffee Cannon" />
          </div>
          <div class="tower-icon" title="Paper Shredder">
            <img src="assets/tower/paper_shredder.png" alt="Paper Shredder" />
          </div>
          <div class="tower-icon" title="Monitor Sniper">
            <img src="assets/tower/monitor_sniper.png" alt="Monitor Sniper" />
          </div>
        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer class="hub-footer">
      <a href="index.html" class="button-link">← Exit Game</a>
      <a
        id="startGameLink"
        href="#"
        class="button-link disabled"
        id="startGameBtn"
        >Start Game</a
      >
    </footer>

    <script>
      let selectedMap = null;

      function selectMap(mapId) {
        selectedMap = mapId;

        const descriptions = {
          hr: "HR Hallway – A winding office corridor with narrow passages and strategic corners. Ideal for long-range defense and tactical tower placement.",
//        it: "IT Overload – Fast enemies and limited tower zones.",
        };

        document.getElementById("mapDescription").textContent =
          descriptions[mapId];
        document.getElementById("startGameLink").classList.remove("disabled");

        // Store the map link temporarily for use after fullscreen
        document
          .getElementById("startGameLink")
          .setAttribute("data-map", `maps/${mapId}.html`);
      }

      function startGame(event) {
        event.preventDefault();

        const targetLink = document
          .getElementById("startGameLink")
          .getAttribute("data-map");
        if (!targetLink) return;

        // Request fullscreen
        const body = document.body;
        if (body.requestFullscreen) {
          body.requestFullscreen().then(() => {
            window.location.href = targetLink;
          });
        } else if (body.webkitRequestFullscreen) {
          body.webkitRequestFullscreen();
          window.location.href = targetLink;
        } else if (body.msRequestFullscreen) {
          body.msRequestFullscreen();
          window.location.href = targetLink;
        } else {
          window.location.href = targetLink;
        }
      }

      // Attach click handler
      document.addEventListener("DOMContentLoaded", () => {
        const startBtn = document.getElementById("startGameLink");
        startBtn.addEventListener("click", startGame);
      });
    </script>
  </body>
</html>
